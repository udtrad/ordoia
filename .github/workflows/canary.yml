# Weekly: is the live site still the site we published?
#
# DEPLOY.md asks for uptime and certificate monitoring on `/oal/v1.0` specifically,
# not just the apex — the home page being up says nothing about whether a six-year-old
# scorecard's printed address still resolves, and that is the failure with the longest
# tail. This turns that sentence into a job.
#
# It is also the only mechanism in this repository that would catch a Cloudflare zone
# setting being switched on years from now, long after anyone remembers why it was off.
# Email Address Obfuscation is on by default; if it is ever re-enabled, the services CTA
# breaks silently and nothing else here would notice.
#
# Since 2026-08-09 it notices two ways rather than one. Check 15 reads the bytes, which
# catches any setting that rewrites HTML. Check 22 reads the zone configuration itself,
# which catches the ones that do not — Speed Brain is on by default and adds a
# Speculation-Rules header while leaving the body byte-identical, so no amount of
# byte-comparison would ever have found it.
#
# It builds first because check 15 byte-compares the live site against the build. A
# mismatch therefore means one of two things, both worth a red: the host mutated what
# it was given, or production is behind `main`.
#
# ── The limitation, stated because it cannot be fixed here ──────────────────────────
#
# GitHub disables scheduled workflows in a repository with no activity for 60 days. This
# site is finished by design: a rubric that changes quarterly is not a standard. So the
# quiet period that disables this canary is the *expected* state, and the canary stops
# exactly when it becomes the only thing watching.
#
# There is no honest in-repo fix. A keepalive bot commit pollutes the history that is
# itself the provenance evidence — a repository whose commits are cited on a scorecard
# cannot carry commits that mean nothing. A second workflow that re-enables this one has
# to be triggered by something, and that something is the same problem again.
#
# So liveness moves out: an external monitor on `/oal/v1.0` and `/services/`, asserting
# `mailto:` present and `/cdn-cgi/l/email-protection` absent. Those two keywords catch
# precisely the Email Address Obfuscation failure, and they are the same pair
# tools/probe-live.mjs uses. DEPLOY.md holds the setup.
#
# **If the external monitor lapses too, nothing notices.** That is the residual risk and
# it is accepted knowingly rather than papered over.

name: canary

on:
  schedule:
    - cron: '17 8 * * 1' # Mondays, 08:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Read, not written. See the same step in deploy.yml, and check 19.
      - name: Read the site record
        id: site
        run: node tools/site-origin.mjs >> "$GITHUB_OUTPUT"

      - run: npm run build

      # Two gates, one run. ORDOIA_LIVE turns on check 15 — the bytes on the wire — and
      # ORDOIA_ZONE_CHECK turns on check 22, the zone configuration underneath them.
      #
      # Check 15 catches Email Address Obfuscation and Rocket Loader indirectly, because
      # both leave /cdn-cgi/ in the HTML. It cannot catch Speed Brain: that adds a
      # Speculation-Rules response header and leaves the body byte-identical, so the
      # strongest check in this suite stays green on a zone quietly instructing browsers to
      # prefetch on our behalf. Speed Brain is on by default on the Free plan.
      #
      # A third token, and a deliberately small one: Zone Settings Read and DNS Read, no
      # more. The deploy token cannot read the zone and this one cannot deploy, so neither
      # can do the other's damage. deploy.yml does not set ORDOIA_ZONE_CHECK for the same
      # reason — a deploy must not be blocked on a zone-read permission.
      #
      # If the token is missing, check 22 fails rather than skips. That is the point: an
      # opt-in check that quietly skips itself reports a green gate having tested nothing,
      # which is the shape the preview gate in deploy.yml already refuses.
      - name: Check the live site, and the zone behind it
        run: npm test
        env:
          ORDOIA_LIVE: ${{ steps.site.outputs.origin }}
          ORDOIA_ZONE_CHECK: '1'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
