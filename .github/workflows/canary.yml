# Weekly: is the live site still the site we published?
#
# DEPLOY.md asks for uptime and certificate monitoring on `/oal/v1.0` specifically,
# not just the apex — the home page being up says nothing about whether a six-year-old
# scorecard's printed address still resolves, and that is the failure with the longest
# tail. This turns that sentence into a job.
#
# It is also the only mechanism that would catch a Cloudflare zone setting being
# switched on years from now, long after anyone remembers why it was off. Email
# Address Obfuscation is on by default; if it is ever re-enabled, the services CTA
# breaks silently and nothing else in this repo would notice.
#
# It builds first because check 15 byte-compares the live site against the build. A
# mismatch therefore means one of two things, both worth a red: the host mutated what
# it was given, or production is behind `main`.

name: canary

on:
  schedule:
    - cron: '17 8 * * 1' # Mondays, 08:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build

      - name: Check the live site
        run: npm test
        env:
          ORDOIA_LIVE: https://ordoia.com
